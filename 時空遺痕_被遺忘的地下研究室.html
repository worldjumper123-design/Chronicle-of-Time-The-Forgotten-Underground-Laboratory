<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時空遺痕 - 被遺忘的地下研究室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: #0c0d0e;
            color: #d1cca8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* 背景網格與暗角 */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(211, 190, 127, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(211, 190, 127, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(5, 5, 5, 0.9) 100%);
            pointer-events: none;
        }

        /* 頂部導覽列 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(15, 16, 18, 0.85);
            border-bottom: 1px solid rgba(211, 190, 127, 0.15);
            z-index: 10;
        }

        .nav-left, .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(211, 190, 127, 0.2);
            color: #a39e83;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
        }

        .nav-btn.active {
            background: rgba(211, 190, 127, 0.15);
            color: #e8deaa;
            border-color: #d3be7f;
        }

        .btn-status {
            background: #1e88e5;
            color: #ffffff;
            border: none;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
        }

        /* 主要內容區域 */
        main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10%;
            flex-grow: 1;
            z-index: 10;
        }

        .hero-left {
            max-width: 650px;
        }

        .subtitle {
            color: #79a888;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #4caf50;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #4caf50;
        }

        .title {
            font-size: 64px;
            font-weight: 900;
            color: #e8deaa;
            letter-spacing: 6px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(232, 222, 170, 0.2);
        }

        .desc-title {
            font-size: 22px;
            color: #d3be7f;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .desc-text {
            color: #8c8771;
            font-size: 15px;
            margin-bottom: 40px;
        }

        /* 輸入與按鈕區域 */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-label {
            font-size: 12px;
            color: #8c8771;
            letter-spacing: 1px;
        }

        .input-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(211, 190, 127, 0.3);
            border-radius: 2px;
            overflow: hidden;
            width: 520px;
        }

        .input-prefix {
            padding-left: 15px;
            color: #d3be7f;
            font-weight: bold;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            outline: none;
            color: #e8deaa;
            padding: 15px 10px;
            font-size: 16px;
            flex-grow: 1;
        }

        .submit-btn {
            background: #d3be7f;
            color: #0c0d0e;
            border: none;
            padding: 0 30px;
            height: 52px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            text-decoration: none;
            justify-content: center;
        }

        .submit-btn:hover {
            background: #e8deaa;
            box-shadow: 0 0 15px rgba(211, 190, 127, 0.4);
        }

        .tags {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            color: #615d4d;
            font-size: 13px;
        }

        /* 右側印章 */
        .archive-seal {
            width: 180px;
            height: 180px;
            border: 2px dashed rgba(211, 190, 127, 0.3);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgba(211, 190, 127, 0.4);
            font-size: 12px;
            text-align: center;
            transform: rotate(-15deg);
        }

        .archive-seal .number {
            font-size: 18px;
            font-weight: bold;
            color: rgba(211, 190, 127, 0.6);
            margin: 5px 0;
        }

        /* 頁尾 */
        footer {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            font-size: 12px;
            color: #4a473b;
            border-top: 1px solid rgba(211, 190, 127, 0.08);
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <header>
        <div class="nav-left">
            <button class="nav-btn active">🎮 預覽</button>
            <button class="nav-btn">✨ 資源</button>
            <button class="nav-btn">💻 程式碼</button>
            <button class="nav-btn">⚔️ 多人遊戲</button>
            <button class="nav-btn">⚙️ 控制台</button>
        </div>
        <div class="nav-right">
            <button class="nav-btn">↻</button>
            <button class="nav-btn">⚙</button>
            <button class="nav-btn">↗</button>
            <button class="btn-status">🔒 已發佈</button>
        </div>
    </header>

    <!-- 主要視覺區 -->
    <main>
        <div class="hero-left">
            <div class="subtitle">
                <span class="dot"></span>
                地下設施 · 第 03 區 · 1984－2024
            </div>
            
            <h1 class="title">時空遺痕</h1>
            <h2 class="desc-title">被遺忘的地下研究室</h2>
            <p class="desc-text">房間仍在運轉，只是沒有人承認。</p>

            <!-- 點擊後跳轉至指定的 LINE 登入網址 -->
            <form action="https://worldjumper123-design.github.io/line-login-for-website/" method="GET" class="form-group">
                <label class="input-label">請輸入你的探險者名稱</label>
                <div class="input-box">
                    <span class="input-prefix">/</span>
                    <input type="text" name="player" value="PLAYER" required autocomplete="off">
                    <button type="submit" class="submit-btn">
                        開始調查 →
                    </button>
                </div>
            </form>

            <div class="tags">
                <span>— 三個封閉房間</span>
                <span>— 四個數位謎題</span>
                <span>— 雙人連線檔案</span>
            </div>
        </div>

        <!-- 檔案封印圖章 -->
        <div class="archive-seal">
            <span>廢棄研究紀錄</span>
            <span class="number">ARCHIVE<br>NO. 1984</span>
            <span>封存中</span>
        </div>
    </main>

    <!-- 頁尾資訊 -->
    <footer>
        <div>記憶實驗室 / 時間序列專案</div>
        <div>點擊操作 · 記錄檢索 · 找到出口</div>
    </footer>

</body>
</html>
